<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מסע החשיבה">
<meta name="theme-color" content="#121845">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>מסע החשיבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-screen game app — full-bleed world background, centered 860px column, bottom sheet for feedback */
:root{
  --bg1:#ffe9a8;--bg2:#ffc4d6;--onbg:#20223a;
  --ink:#20223a;--muted:#5d607e;--card:#ffffff;--line:#e3e5f1;--chip:#f2f3fa;
  --accent:#ff7a45;--accent-dk:#cc561f;--btn-ink:#20223a;
  --good:#17894a;--good-bg:#d9f6e5;--bad:#cc3d3d;--bad-bg:#fde2e2;
  --fd:'Fredoka','Varela Round',system-ui,sans-serif;
  --fb:'Varela Round','Fredoka',system-ui,sans-serif;
  color-scheme:light;
}
body[data-world="space"]{--bg1:#121845;--bg2:#3a2480;--onbg:#ffffff;--accent:#ffc12e;--accent-dk:#c58a00}
body[data-world="animals"]{--bg1:#b5e69a;--bg2:#ffe49a;--onbg:#1c3610;--accent:#ff8a3d;--accent-dk:#c75d14}
body[data-world="magic"]{--bg1:#4f2380;--bg2:#cf4d8a;--onbg:#ffffff;--accent:#7ee8d1;--accent-dk:#2ea68e}
body[data-world="ocean"]{--bg1:#0d5f80;--bg2:#36c0bd;--onbg:#ffffff;--accent:#ffd84d;--accent-dk:#c49c0c}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg1);background-image:linear-gradient(165deg,var(--bg1),var(--bg2));color:var(--ink);font-family:var(--fb);direction:rtl;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body[data-world="space"]{background-image:radial-gradient(2px 2px at 12% 18%,#fff8,transparent),radial-gradient(1.5px 1.5px at 72% 12%,#fff9,transparent),radial-gradient(2px 2px at 85% 60%,#fff7,transparent),radial-gradient(1.5px 1.5px at 30% 80%,#fff8,transparent),radial-gradient(1px 1px at 55% 40%,#fff9,transparent),linear-gradient(165deg,var(--bg1),var(--bg2))}
body[data-world="ocean"]{background-image:radial-gradient(circle at 15% 85%,#ffffff22 0 30px,transparent 31px),radial-gradient(circle at 80% 70%,#ffffff1a 0 18px,transparent 19px),radial-gradient(circle at 60% 20%,#ffffff14 0 12px,transparent 13px),linear-gradient(180deg,var(--bg2),var(--bg1))}
body[data-world="magic"]{background-image:radial-gradient(circle at 80% 10%,#ffffff26 0 60px,transparent 61px),linear-gradient(165deg,var(--bg1),var(--bg2))}
body[data-world="animals"]{background-image:radial-gradient(ellipse at 50% 120%,#7cc45a 0 40%,transparent 41%),linear-gradient(180deg,var(--bg2),var(--bg1))}
#app{position:relative;height:100%}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
.onbg{color:var(--onbg)}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 8px 0 rgba(0,0,0,.08),0 14px 30px rgba(0,0,0,.12)}
.btn{font-family:var(--fd);font-weight:600;font-size:1.35rem;padding:.75em 1.4em;border-radius:20px;border:0;background:var(--accent);color:var(--btn-ink);box-shadow:0 6px 0 var(--accent-dk);cursor:pointer;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-dk)}
.btn:focus-visible,.opt:focus-visible,.pickcard:focus-visible,.ibtn:focus-visible{outline:4px solid #2b59ff;outline-offset:3px}
.btn.ghost{background:var(--chip);box-shadow:0 5px 0 #cfd2e4;color:var(--ink)}
.btn.big{font-size:1.7rem;padding:.8em 1.6em;width:100%}
.btn[disabled]{opacity:.5}
.saybtn.on{background:var(--accent);box-shadow:0 4px 0 var(--accent-dk)}
.lead{font-size:1.1rem;color:var(--muted);align-self:flex-start}
.ibtn{border:0;background:rgba(255,255,255,.9);color:var(--ink);width:52px;height:52px;border-radius:16px;font-size:1.5rem;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
/* top bar */
.topbar{display:flex;align-items:center;gap:12px}
.avatar{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:2.4rem;box-shadow:0 5px 0 rgba(0,0,0,.12);position:relative;flex:none}
.avatar .badge{position:absolute;bottom:-8px;left:-8px;font-size:1.1rem;background:var(--accent);border-radius:999px;padding:2px 7px;font-family:var(--fd);color:var(--btn-ink)}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:8px 14px;font-family:var(--fd);font-weight:600;font-size:1.2rem;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;color:var(--ink)}
.hello{font-family:var(--fd);font-size:1.5rem;font-weight:600}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero .char{font-size:clamp(4.5rem,14vw,7rem);line-height:1;animation:bob 2.6s ease-in-out infinite}
.bubble{background:var(--chip);border-radius:18px;padding:12px 16px;font-size:1.15rem;position:relative}
.mission-title{font-size:1.8rem}
.meta{display:flex;gap:10px;flex-wrap:wrap}
.tag{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:1rem}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
/* journey */
.path{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:6px 2px 10px}
.node{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.85rem;color:var(--muted)}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;border:3px solid var(--line);background:#fff;color:var(--muted);font-size:1.05rem}
.node.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.node.today .dot{border-color:var(--accent-dk);background:var(--accent);color:var(--btn-ink);animation:pulse 1.6s infinite}
.node.missed .dot{background:var(--chip)}
.node.goal .dot{background:#ffd54a;border-color:#d9a400;font-size:1.3rem}
.link{flex:none;width:14px;height:4px;border-radius:2px;background:var(--line)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,180,0,.25)}}
/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sk{background:var(--chip);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sk b{font-family:var(--fd);font-weight:600;font-size:1rem}
.lv{display:flex;gap:4px}
.lv i{flex:1;height:8px;border-radius:4px;background:#d9dbea}
.lv i.on{background:var(--accent-dk)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:rgba(255,255,255,.95);border:0;border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--fd);font-size:1.2rem;font-weight:600;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:pointer}
.tile .e{font-size:2.4rem}
.tile small{font-family:var(--fb);font-weight:400;font-size:.9rem;color:var(--muted)}
/* play */
.playbar{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:18px;background:rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .4s}
.qcard{display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.qhead{display:flex;gap:10px;align-items:center}
.sktag{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:.95rem}
.stars-lv{color:#e0a400;letter-spacing:1px}
.prompt{font-family:var(--fd);font-weight:600;font-size:clamp(1.35rem,3.6vw,1.75rem);line-height:1.35}
.stim{display:flex;flex-direction:column;align-items:center;gap:12px}
.timer{position:absolute;top:0;right:0;left:0;height:6px;background:var(--chip)}
.timer>i{display:block;height:100%;background:var(--accent-dk);width:100%;transform-origin:right}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{background:#fff;border:3px solid var(--line);border-radius:20px;box-shadow:0 6px 0 #d3d6e8;min-height:76px;font-family:var(--fd);font-weight:600;font-size:clamp(1.25rem,3.4vw,1.6rem);color:var(--ink);padding:10px;cursor:pointer;display:grid;place-items:center;transition:transform .08s;touch-action:manipulation}
.opt:active{transform:translateY(3px)}
.opt.fig{aspect-ratio:1/1;min-height:0;padding:8%;max-height:190px}
.opts.figs{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt.ok{background:var(--good-bg);border-color:var(--good);box-shadow:0 6px 0 var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 6px 0 var(--bad);animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.fig{width:100%;height:100%;display:block}
.cell{width:clamp(48px,13vw,116px);aspect-ratio:1/1;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px;display:grid;place-items:center;flex:none}
.cell.q{background:var(--chip);border-style:dashed;font-family:var(--fd);font-size:2rem;color:var(--muted)}
.seq{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.sep{color:var(--muted);font-size:1.2rem}
.mx{display:grid;grid-template-columns:repeat(3,clamp(64px,19vw,108px));gap:8px}
.mx .cell{width:100%}
.anrow{display:flex;gap:10px;align-items:center;justify-content:center}
.anbox{display:flex;flex-direction:column;gap:10px;align-items:center}
.num{min-width:clamp(48px,12vw,78px);height:clamp(48px,12vw,78px);padding:0 8px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:clamp(1.3rem,3.6vw,1.9rem);font-variant-numeric:tabular-nums}
.num.q{background:#fff;border:3px dashed var(--accent-dk);color:var(--accent-dk)}
.words{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-family:var(--fd);font-weight:600;font-size:clamp(1.3rem,3.6vw,1.8rem)}
.word{background:var(--chip);border-radius:14px;padding:10px 16px}
.word.q{background:#fff;border:3px dashed var(--accent-dk);color:var(--accent-dk);min-width:64px;text-align:center}
.eq{direction:ltr;display:flex;flex-direction:column;gap:8px;align-items:center;font-family:var(--fd);font-weight:600;font-size:clamp(1.5rem,4.2vw,2.1rem)}
.eq .em{font-size:1.15em}
.passage{background:#fffbea;border:2px solid #f2e2a6;border-radius:18px;padding:16px 18px;font-size:clamp(1.15rem,3vw,1.35rem);line-height:1.7;max-width:62ch}
.mirror{display:flex;gap:14px;align-items:center;justify-content:center}
.mline{width:0;height:clamp(90px,24vw,150px);border-left:4px dashed var(--accent-dk)}
.mbox{width:clamp(96px,26vw,160px)}
/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .25s ease-out}
.sheet .in{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet.good{background:var(--good-bg)}
.sheet.bad{background:#fff4ef}
.sheet h3{font-size:1.6rem}
.sheet.good h3{color:var(--good)}
.sheet.bad h3{color:var(--bad)}
.explain{font-size:1.2rem;line-height:1.6}
@keyframes up{from{transform:translateY(100%)}}
/* setup */
.pickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pickcard{border:4px solid transparent;background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--fd);font-weight:600;font-size:1.3rem;color:var(--ink);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.pickcard .e{font-size:3.2rem;line-height:1.1}
.pickcard.sel{border-color:var(--accent-dk);background:#fff8e6}
.field{display:flex;flex-direction:column;gap:6px;font-size:1.1rem}
.field input,.field select{font:inherit;font-size:1.3rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:3px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font-family:var(--fd);font-weight:600;font-size:1.15rem;color:var(--ink);cursor:pointer}
.chipbtn.sel{border-color:var(--accent-dk);background:#fff3d6}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,.4)}
.steps i.on{background:var(--accent)}
/* done */
.chest{font-size:7rem;cursor:pointer;background:none;border:0;line-height:1;animation:wiggle 1.2s infinite}
@keyframes wiggle{10%,30%{transform:rotate(-8deg)}20%,40%{transform:rotate(8deg)}50%{transform:none}}
.prize{font-size:6rem;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.stat{background:var(--chip);border-radius:16px;padding:12px 6px}
.stat b{display:block;font-family:var(--fd);font-size:1.8rem;font-variant-numeric:tabular-nums}
/* collection */
.coll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.slot{aspect-ratio:1/1;background:var(--chip);border-radius:18px;display:grid;place-items:center;font-size:clamp(2rem,8vw,3.4rem)}
.slot.locked{color:#c5c8da;font-family:var(--fd);font-size:2rem}
/* parent */
table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:.9rem}
.tbl{overflow-x:auto}
.st{border-radius:999px;padding:3px 10px;font-size:.9rem;white-space:nowrap}
.st.ahead{background:#dde8ff;color:#2846a8}
.st.ok{background:var(--good-bg);color:var(--good)}
.st.behind{background:#ffe9d6;color:#a3500d}
.st.new{background:var(--chip);color:var(--muted)}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);height:100%;justify-content:flex-end}
.bars span{width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.note{background:#f6f7fc;border-radius:16px;padding:14px 16px;line-height:1.6}
.tips{margin:0;padding:0 1.2em 0 0;display:flex;flex-direction:column;gap:10px;line-height:1.6}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{background:#f6f7fc;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mtxt{line-height:1.5}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:10px 20px;font-family:var(--fd);font-weight:600;font-size:1.3rem;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:30;animation:pop .35s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (max-width:560px){
  .opts.figs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opt.fig{max-height:150px}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .card{padding:16px;border-radius:20px}
  .avatar{width:54px;height:54px;font-size:2rem}
  .coll{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="s-login" hidden></section>
  <section class="screen" id="s-setup" hidden></section>
  <section class="screen" id="s-home" hidden></section>
  <section class="screen" id="s-play" hidden></section>
  <section class="screen" id="s-done" hidden></section>
  <section class="screen" id="s-coll" hidden></section>
  <section class="screen" id="s-gate" hidden></section>
  <section class="screen" id="s-parent" hidden></section>
</div>
<div id="sheet-host"></div>
<canvas id="fx"></canvas>

<script src="firebase-config.js?v=2"></script>
<script>
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d)};
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const addDays=(k,n)=>{const t=new Date(parseKey(k)+n*864e5);return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`};
const DOW=['א','ב','ג','ד','ה','ו','ש'];
const dowOf=k=>DOW[new Date(parseKey(k)).getUTCDay()];

/* ============ state ============ */
const LS='mesa-hachshiva-v1';
let state=null;
const SKILLS={
  analogy:{name:'אנלוגיות מילים',stage:'A',e:'🔗'},
  oddword:{name:'מילה לא שייכת',stage:'A',e:'🧺'},
  reading:{name:'הבנת הנקרא',stage:'A',e:'📖'},
  logic:{name:'חשיבה לוגית',stage:'A',e:'🧩'},
  wordprob:{name:'בעיות מילוליות',stage:'A',e:'🧮'},
  symbols:{name:'משוואות וסמלים',stage:'A',e:'🍎'},
  facts:{name:'חשבון מהיר',stage:'A',e:'⚡'},
  series:{name:'סדרות מספרים',stage:'AB',e:'🔢'},
  shapeseries:{name:'סדרות צורות',stage:'B',e:'🔷'},
  matrix:{name:'מטריצות',stage:'B',e:'▦'},
  shapeanalogy:{name:'אנלוגיות צורות',stage:'B',e:'🔺'},
  oddshape:{name:'צורה יוצאת דופן',stage:'B',e:'⭐'},
  mirror:{name:'תמונת מראה',stage:'B',e:'🪞'}
};
const WORLDS={

    startDate:dkey(),skills,stars:0,collection:[],days:{},streak:{last:'',count:0},avgSec:42,seen:{},retry:{},sessions:[],subs:{},facts:{},mist:[],mistDone:0,t:0};

function migrate(s){
  const base=newState();
  if(!s||typeof s!=='object')return base;
  s.profile=Object.assign(base.profile,s.profile||{});
  s.settings=Object.assign(base.settings,s.settings||{});
  s.skills=Object.assign(base.skills,s.skills||{});
  ['days','streak','seen','retry','subs','facts'].forEach(k=>{if(!s[k])s[k]=base[k]});
  if(!Array.isArray(s.collection))s.collection=[];
  if(!Array.isArray(s.sessions))s.sessions=[];
  if(!Array.isArray(s.mist))s.mist=[];
  if(typeof s.mistDone!=='number')s.mistDone=0;
  if(!s.startDate)s.startDate=dkey();
  if(!s.avgSec)s.avgSec=42;
  if(typeof s.stars!=='number')s.stars=0;
  if(!s.v||s.v<2){s.settings.autoRead=false;s.v=2}
  if(s.settings.nikud===undefined)s.settings.nikud=true;
  return s;
}

window.__cloudReady=function(api){
  cloud=api;
  api.onUser(async u=>{
    if(u){
      cloudUser=u;setLocalMode(false);
      let local=loadLocal();
      if(!local||!(local.profile&&local.profile.name)){const anon=loadLocal(LS);if(anon&&anon.profile&&anon.profile.name)local=anon}
      let remote=null;try{remote=await api.load(u.uid)}catch(e){}
      state=(remote&&remote.json&&(remote.t||0)>((local&&local.t)||0))?migrate(JSON.parse(remote.json)):migrate(local);
      saveLocal();
      if(!remote||(remote.t||0)<(state.t||0)){state.t=state.t||Date.now();syncRemote()}
      boot();
    }else{
      cloudUser=null;
      if(!localMode())renderLogin(false);

};

function namesWithChild(n){

/* ============ adaptive engine + plan ============ */
function planInfo(){
  const today=dkey(),s=state.settings;
  let daysLeft=null,frac;
  if(s.testDate){daysLeft=daysBetween(today,s.testDate);const total=Math.max(1,daysBetween(state.startDate,s.testDate));frac=clamp(daysBetween(state.startDate,today)/total,0,1)}
  else frac=clamp(daysBetween(state.startDate,today)/45,0,1);
  return {today,daysLeft,frac,target:1.6+3.2*frac};
}
function skillStatus(k){
  const s=state.skills[k],t=planInfo().target;
  if(s.n<3)return ['new','עוד לא תורגל'];
  const d=s.lvl-t;
  if(d>.5)return ['ahead','מקדים את התוכנית'];
  if(d>-.6)return ['ok','בקצב'];
  return ['behind','צריך חיזוק'];
}
function focusWeight(k){
  const f=state.settings.focus,st=SKILLS[k].stage;
  if(f==='both'||st.includes(f))return 1;
  return f==='A'?.25:.35;
}
function chooseSkill(recent){
  const t=planInfo().target;
  const ks=Object.keys(SKILLS);
  const w=ks.map(k=>{const s=state.skills[k];let x=focusWeight(k)*(1+Math.max(0,t-s.lvl)*1.4+(s.n<4?1:0));
    if(recent.slice(-2).includes(k))x*=.15;if(recent.slice(-1)[0]===k)x=0;return x});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<ks.length;i++){r-=w[i];if(r<=0)return ks[i]}
  return ks[0];
}
function levelFor(k,warm){
  const s=state.skills[k];let L=Math.floor(s.lvl);
  if(warm)L=Math.max(1,L-1);else if(Math.random()<.18)L-=1;
  return clamp(L,1,5);
}
function makeQ(k,warm){
  const L=levelFor(k,warm);
  try{
    let q=GEN[k](L);
    // half the time, generate a few candidates and keep the one whose sub-type is weakest
    if(q.sub!==undefined&&k!=='facts'&&Math.random()<.5){for(let j=0;j<2;j++){const c=GEN[k](L);if(c.sub!==undefined&&subAcc(k,c.sub)<subAcc(k,q.sub))q=c}}
    q.level=L;if(q.ans<0||!q.opts||q.opts.length<2)throw 0;return q}
  catch(e){const q=GEN.series(1);q.level=1;return q}
}
function missionSize(kind){
  const base=clamp(Math.round(state.settings.minutes*60/state.avgSec),5,40);
  if(kind==='bonus')return clamp(Math.round(base/2),5,15);
  if(kind==='exam')return 12;
  return base;
}

const REVIEW_GAPS=[1,3,7];   // days until the next review after each correct answer
const MIST_MAX=25;
function packQ(q){const o={};['skill','sub','fact','level','prompt','lead','stim','speak','explain','optType','promptAfter','bankId'].forEach(k=>{if(q[k]!==undefined)o[k]=q[k]});
  o.opts=q.opts.map(x=>({html:x.html,text:x.text}));o.ans=q.ans;return o}
function unpackQ(o){const q=JSON.parse(JSON.stringify(o));const idx=shuffle(q.opts.map((_,i)=>i));q.opts=idx.map(i=>q.opts[i]);q.ans=idx.indexOf(o.ans);return q}
const qSig=q=>q.skill+'|'+q.prompt+'|'+(q.stim||'').length+'|'+q.opts.map(o=>o.text||o.html.length).join(',');
function addMistake(q){
  const today=dkey(),sig=qSig(q);let e=state.mist.find(m=>m.sig===sig);
  if(e){e.wrong++;e.ok=0;e.stage=0;e.due=addDays(today,1);e.last=today;return e}
  e={id:Date.now().toString(36)+rnd(100,999),sig,q:packQ(q),due:addDays(today,1),stage:0,ok:0,wrong:1,first:today,last:today};
  state.mist.push(e);
  if(state.mist.length>MIST_MAX){state.mist.sort((a,b)=>(b.wrong-a.wrong)||(b.last>a.last?1:-1));state.mist=state.mist.slice(0,MIST_MAX)}
  return e;
}
function dueMistakes(){const t=dkey();return state.mist.filter(m=>m.due<=t&&!(M&&M.served.includes(m.id))&&focusWeight(m.q.skill)>=1)}

  let rec;
  if(!practiced.length)rec='עדיין אין מספיק נתונים. אחרי כמה משימות תופיע כאן הערכת קצב.';
  else if(avgDiff< -.6)rec=`ההתקדמות איטית מהתוכנית${P.daysLeft?` ל-${P.daysLeft} הימים שנותרו`:''}. כדאי להעלות ל-${Math.min(45,s.minutes+10)} דקות ביום או להוסיף סיבוב בונוס. המשימות כבר מתמקדות אוטומטית בנושאים החלשים.`;
  else if(avgDiff>.6)rec='ההתקדמות מהירה מהתוכנית. הקושי עולה אוטומטית. אפשר להוסיף "אתגר מבחן" עם שעון כדי לתרגל עבודה בלחץ זמן.';
  else rec='ההתקדמות בקצב של התוכנית. כדאי לשמור על רצף יומי.';
  const last=[...Array(14).keys()].map(i=>addDays(P.today,i-13));
  const maxSec=Math.max(60,...last.map(k=>(state.days[k]||{}).sec||0));
  const totQ=Object.values(state.days).reduce((a,d)=>a+d.q,0),totC=Object.values(state.days).reduce((a,d)=>a+d.c,0),totMin=Math.round(Object.values(state.days).reduce((a,d)=>a+d.sec,0)/60);
  $('#s-parent').innerHTML=`<div class="wrap">
    <div class="topbar"><button class="ibtn" id="back" aria-label="חזרה">→</button><h1 class="onbg" style="font-size:1.9rem">אזור הורים</h1></div>
    ${insightsHTML()}
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <h3>מצב התוכנית</h3>
      <div class="stats"><div class="stat"><b>${P.daysLeft===null?'—':Math.max(0,P.daysLeft)}</b>ימים למבחן</div><div class="stat"><b>${totQ?Math.round(totC/totQ*100):0}%</b>דיוק כללי</div><div class="stat"><b>${totMin}</b>דקות תרגול</div></div>
      <div class="note">${esc(rec)}</div>
      <div><div class="muted" style="margin-bottom:6px">דקות תרגול ב-14 הימים האחרונים</div>
      <div class="bars">${last.map(k=>{const sec=(state.days[k]||{}).sec||0;return `<div><span style="height:${Math.round(sec/maxSec*70)}px"></span>${dowOf(k)}</div>`}).join('')}</div></div>
    </div>
    <div class="card"><h3 style="margin-bottom:10px">התקדמות לפי נושא</h3><div class="tbl"><table><thead><tr><th>נושא</th><th>רמה</th><th>דיוק</th><th>זמן ממוצע</th><th>שאלות</th><th>מצב</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="muted" style="margin:10px 0 0;font-size:.95rem">רמת היעד להיום: ${P.target.toFixed(1)} מתוך 5. היעד עולה בהדרגה עד יום המבחן.</p></div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <h3>הגדרות</h3>
      <div class="field"><label for="p-name">שם הילד או הילדה</label><input id="p-name" value="${esc(state.profile.name)}" maxlength="16"></div>
      <div class="chips" id="p-g"><button class="chipbtn ${state.profile.gender==='f'?'sel':''}" data-v="f">בת</button><button class="chipbtn ${state.profile.gender==='m'?'sel':''}" data-v="m">בן</button></div>
      <div class="field"><label for="p-date">תאריך המבחן</label><input type="date" id="p-date" value="${s.testDate}"></div>
      <div class="field"><span>דקות ביום</span><div class="chips" id="p-min">${[10,15,20,30,45].map(m=>`<button class="chipbtn ${s.minutes===m?'sel':''}" data-v="${m}">${m}</button>`).join('')}</div></div>
      <div class="field"><span>מיקוד</span><div class="chips" id="p-focus">${[['both','שני השלבים'],['A',"שלב א'"],['B',"שלב ב'"]].map(([v,t])=>`<button class="chipbtn ${s.focus===v?'sel':''}" data-v="${v}">${t}</button>`).join('')}</div></div>
      <div class="field"><span>ניקוד בשאלות</span><div class="chips" id="p-nik">${[['1','עם ניקוד'],['0','בלי ניקוד']].map(([v,t])=>`<button class="chipbtn ${(s.nikud?'1':'0')===v?'sel':''}" data-v="${v}">${t}</button>`).join('')}</div></div>
      <div class="field"><label for="p-voice">קול ההקראה</label><div class="row"><select id="p-voice" style="flex:1;min-width:0">${heVoices.length?heVoices.map(v=>`<option value="${esc(v.name)}" ${heVoice&&v.name===heVoice.name?'selected':''}>${esc(v.name)}</option>`).join(''):'<option value="">לא נמצא קול עברי במכשיר</option>'}</select><button class="btn ghost" id="p-test" type="button">🔊 בדיקה</button></div></div>
      <div class="field"><span>מהירות ההקראה</span><div class="chips" id="p-rate">${[[.75,'איטית'],[.9,'רגילה'],[1,'מהירה']].map(([v,t])=>`<button class="chipbtn ${s.rate===v?'sel':''}" data-v="${v}">${t}</button>`).join('')}</div></div>
      <div class="note" style="font-size:.95rem">איכות ההקראה תלויה בקולות שמותקנים במכשיר. באייפד אפשר להוריד קול עברי משופר: הגדרות ← נגישות ← תוכן מוקרא ← קולות ← עברית, ולבחור קול שמסומן "משופר" או "פרימיום". אחרי ההורדה, בחרו אותו כאן.</div>
      <div class="field"><span>הקראה אוטומטית בכל שאלה (בדרך כלל עדיף כבוי, ההקראה זמינה בלחיצה על 🔊)</span><div class="chips" id="p-read"><button class="chipbtn ${s.autoRead?'sel':''}" data-v="1">פועל</button><button class="chipbtn ${!s.autoRead?'sel':''}" data-v="0">כבוי</button></div></div>
      <div class="field"><span>צלילים</span><div class="chips" id="p-snd"><button class="chipbtn ${s.sound?'sel':''}" data-v="1">פועל</button><button class="chipbtn ${!s.sound?'sel':''}" data-v="0">כבוי</button></div></div>
      <div class="row"><button class="btn" id="p-save">שמירה</button><button class="btn ghost" id="p-world">החלפת עולם ודמות</button></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>חשבון</h3>
      ${cloudUser?`<div>מחובר: <b>${esc(cloudUser.name||'')}</b> <span class="muted">${esc(cloudUser.email||'')}</span></div><div class="muted">ההתקדמות נשמרת בחשבון ומסונכרנת בין מכשירים.</div><div><button class="btn ghost" id="acc-out">התנתקות</button></div>`
      :CLOUD?`<div class="muted">משחקים בלי חשבון, וההתקדמות נשמרת רק במכשיר הזה. בהתחברות, ההתקדמות הנוכחית תעבור לחשבון.</div><div><button class="btn" id="acc-in" ${cloud?'':'disabled'}>התחברות עם Google</button></div>`
      :'<div class="muted">ההתקדמות נשמרת במכשיר הזה.</div>'}</div>
    <div class="card note" style="display:flex;flex-direction:column;gap:8px">
      <h3>על התרגול</h3>
      <div>בשלב א' יש בעיקר חשיבה מילולית וכמותית: אנלוגיות מילים, מילה שלא שייכת, הבנת הנקרא, חשיבה לוגית, בעיות מילוליות וסדרות מספרים.</div>
      <div>בשלב ב' מתווספת חשיבה צורנית: סדרות צורות, מטריצות, אנלוגיות צורות, צורה יוצאת דופן ותמונת מראה.</div>
      <div>כל נושא מתקדם ברמה משלו (1 עד 5). תשובה נכונה ומהירה מעלה את הרמה, טעות מורידה אותה מעט, ושאלות שנטעו בהן חוזרות בהמשך. ההתקדמות נשמרת במכשיר, ואם מתחברים עם Google היא נשמרת גם בחשבון ועוברת בין מכשירים.</div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>איפוס</h3><div class="muted">מוחק את כל ההתקדמות, הכוכבים והאוסף.</div><div id="reset-box"><button class="btn ghost" id="p-reset">איפוס התקדמות</button></div></div>
  </div>`;
  show('parent');$('#back').onclick=renderHome;
  const chipGroup=(id,fn)=>document.querySelectorAll(`#${id} .chipbtn`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${id} .chipbtn`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');fn(b.dataset.v)});
  const tmp={gender:state.profile.gender,minutes:s.minutes,focus:s.focus,autoRead:s.autoRead,sound:s.sound,rate:s.rate||.9,nikud:s.nikud};
  chipGroup('p-g',v=>tmp.gender=v);chipGroup('p-min',v=>tmp.minutes=+v);chipGroup('p-focus',v=>tmp.focus=v);chipGroup('p-read',v=>tmp.autoRead=v==='1');chipGroup('p-snd',v=>tmp.sound=v==='1');chipGroup('p-rate',v=>tmp.rate=+v);chipGroup('p-nik',v=>tmp.nikud=v==='1');
  const applyVoice=()=>{const vn=$('#p-voice').value;const v=heVoices.find(x=>x.name===vn);if(v)heVoice=v};
  $('#p-test').onclick=()=>{applyVoice();const r=s.rate;s.rate=tmp.rate;speak(`שלום ${state.profile.name}! כך נשמעת ההקראה במשחק.`);s.rate=r};
  $('#p-save').onclick=()=>{const n=$('#p-name').value.trim();if(n)state.profile.name=n;state.profile.gender=tmp.gender;Object.assign(s,{minutes:tmp.minutes,focus:tmp.focus,autoRead:tmp.autoRead,sound:tmp.sound,rate:tmp.rate,nikud:tmp.nikud,voice:$('#p-voice').value||s.voice,testDate:$('#p-date').value||''});applyVoice();save();toast('נשמר');renderParent()};
  $('#p-world').onclick=()=>renderSetup(1);
  const ao=$('#acc-out');if(ao)ao.onclick=async()=>{clearTimeout(syncT);if(cloudUser&&cloud)await cloud.save(cloudUser.uid,{json:JSON.stringify(state),t:state.t||Date.now()}).catch(()=>{});setLocalMode(false);await cloud.signOut()};
  const ai=$('#acc-in');if(ai)ai.onclick=async()=>{ai.disabled=true;try{await cloud.signIn()}catch(e){toast('ההתחברות לא הצליחה');ai.disabled=false}};
  $('#p-reset').onclick=()=>{$('#reset-box').innerHTML=`<div class="row"><span style="font-weight:600">בטוח? אי אפשר לבטל.</span><button class="btn" id="r-yes" style="background:var(--bad);color:#fff;box-shadow:0 6px 0 #8f2323">כן, לאפס</button><button class="btn ghost" id="r-no">ביטול</button></div>`;
    $('#r-no').onclick=renderParent;$('#r-yes').onclick=()=>{const keep={profile:state.profile,settings:state.settings};state=newState();state.profile=keep.profile;state.settings=keep.settings;save();toast('ההתקדמות אופסה');renderHome()}};
}

/* ============ self-test hook (used for QA only) ============ */
window.__selftest=function(){
  const errs=[];const saved=JSON.stringify(state);
  for(const k of Object.keys(GEN))for(let L=1;L<=5;L++)for(let r=0;r<120;r++){
    try{const q=GEN[k](L);const n=q.opts.length;const keys=q.opts.map(o=>o.html);
      if(q.ans<0||q.ans>=n)errs.push(`${k} L${L} bad ans`);
      if(n<(k==='logic'&&L===1?2:3))errs.push(`${k} L${L} only ${n} opts`);
      if(!(k==='oddshape'&&L===1)&&new Set(keys).size!==n)errs.push(`${k} L${L} duplicate opts`);
      if(!q.explain)errs.push(`${k} L${L} no explain`);
    }catch(e){errs.push(`${k} L${L} threw ${e&&e.message}`)}}
  state=JSON.parse(saved);
  return [...new Set(errs)];
};

/* ============ start ============ */
if(CLOUD&&!localMode()){
  state=migrate(loadLocal(LS));renderLoading();
  setTimeout(()=>{if(!cloud&&current==='login')renderLogin(true)},10000);
}else{
  state=migrate(loadLocal(LS));boot();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeak()});
</script>

<script type="module">
const cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey){
  try{
    const V='10.12.2',B=`https://www.gstatic.com/firebasejs/${V}/`;
    const [{initializeApp},A,D]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=initializeApp(cfg),auth=A.getAuth(app),db=D.getFirestore(app);
    try{await A.getRedirectResult(auth)}catch(e){}
    const toUser=u=>u?{uid:u.uid,name:u.displayName||'',email:u.email||''}:null;
    window.__cloudReady({
      onUser:fn=>A.onAuthStateChanged(auth,u=>fn(toUser(u))),
      signIn:async()=>{const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
        try{await A.signInWithPopup(auth,p)}catch(e){if(/popup-blocked|operation-not-supported|cancelled-popup/.test(e.code||''))await A.signInWithRedirect(auth,p);else if(!/popup-closed/.test(e.code||''))throw e}},
      signOut:()=>A.signOut(auth),
      load:async uid=>{const s=await D.getDoc(D.doc(db,'users',uid));return s.exists()?s.data():null},
      save:(uid,data)=>D.setDoc(D.doc(db,'users',uid),data)
    });
  }catch(e){console.error(e);window.__cloudFail&&window.__cloudFail(e)}
}
</script>
